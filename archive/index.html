<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дело НС-0774-КА — Скрипторий Боньярда</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,500&family=Cinzel:wght@400;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment-light: #f0e2c4;
    --parchment-mid: #e4d1a8;
    --parchment-dark: #d4be8a;
    --ink-dark: #2a1f14;
    --ink-body: #3d2e1e;
    --ink-faded: #6b5a48;
    --red-stamp: #8b1a1a;
    --seal-gold: #b8963a;
    --seal-dark: #8a6d28;
    --margin-note: #5a3d2b;
    --tab-active: #d4be8a;
    --tab-inactive: #b8a37a;
    --shadow-soft: rgba(42, 31, 20, 0.15);
    --shadow-hard: rgba(42, 31, 20, 0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1410;
    background-image:
      radial-gradient(ellipse at 30% 20%, rgba(42, 31, 20, 0.4) 0%, transparent 70%),
      radial-gradient(ellipse at 70% 80%, rgba(42, 31, 20, 0.3) 0%, transparent 70%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 30px 20px;
    font-family: 'Spectral', serif;
  }
  .case-wrapper { max-width: 820px; width: 100%; }
  .case-cover {
    background: linear-gradient(135deg, var(--parchment-mid) 0%, var(--parchment-light) 30%, var(--parchment-mid) 60%, var(--parchment-dark) 100%);
    border: 2px solid var(--seal-dark); border-radius: 4px; padding: 50px 60px;
    position: relative; margin-bottom: 24px;
    box-shadow: 0 4px 20px var(--shadow-hard), inset 0 0 80px rgba(180, 160, 120, 0.3);
    overflow: hidden; cursor: pointer; transition: transform 0.2s ease;
  }
  .case-cover:hover { transform: translateY(-2px); }
  .case-cover::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(139, 110, 70, 0.03) 3px, rgba(139, 110, 70, 0.03) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 5px, rgba(139, 110, 70, 0.02) 5px, rgba(139, 110, 70, 0.02) 6px);
    pointer-events: none;
  }
  .cover-stamp {
    position: absolute; top: 20px; right: 30px; border: 3px solid var(--red-stamp);
    color: var(--red-stamp); font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700;
    letter-spacing: 3px; padding: 6px 14px; transform: rotate(6deg); opacity: 0.75; text-transform: uppercase;
  }
  .cover-seal {
    position: absolute; bottom: 25px; right: 40px; width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #d4a84a, var(--seal-gold) 40%, var(--seal-dark) 80%, #6b5420);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 3px rgba(255,220,140,0.4);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif; font-size: 11px; color: #3a2810; font-weight: 700;
    text-align: center; line-height: 1.2; letter-spacing: 1px;
  }
  .cover-classification { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 4px; color: var(--ink-faded); text-transform: uppercase; margin-bottom: 8px; }
  .cover-case-number { font-family: 'Cinzel', serif; font-size: 34px; font-weight: 700; color: var(--ink-dark); margin-bottom: 4px; letter-spacing: 2px; }
  .cover-subtitle { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-style: italic; color: var(--ink-faded); margin-bottom: 24px; }
  .cover-divider { width: 200px; height: 1px; background: linear-gradient(90deg, transparent, var(--seal-gold), transparent); margin: 20px 0; }
  .cover-meta { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: var(--ink-faded); line-height: 1.8; }
  .cover-meta strong { color: var(--ink-body); font-weight: 600; }
  .cover-handwriting { position: absolute; bottom: 30px; left: 60px; font-family: 'Spectral', serif; font-size: 17px; font-style: italic; color: var(--margin-note); opacity: 0.7; }
  .cover-click-hint { font-family: 'Cormorant Garamond', serif; font-size: 14px; color: var(--ink-faded); text-align: center; margin-top: 30px; opacity: 0.5; font-style: italic; }
  .nav-bar { display: flex; gap: 4px; padding: 0 10px; flex-wrap: wrap; margin-bottom: -2px; position: relative; z-index: 2; }
  .nav-tab {
    font-family: 'Cormorant Garamond', serif; font-size: 15px; padding: 8px 16px;
    background: var(--tab-inactive); border: 1px solid #a08a60; border-bottom: none;
    border-radius: 4px 4px 0 0; cursor: pointer; color: var(--ink-faded); transition: all 0.2s ease; white-space: nowrap;
  }
  .nav-tab:hover { background: var(--parchment-mid); color: var(--ink-body); }
  .nav-tab.active { background: var(--parchment-light); color: var(--ink-dark); font-weight: 600; border-color: var(--seal-dark); position: relative; z-index: 3; }
  .report-selector { display: flex; gap: 8px; margin-bottom: 12px; padding: 0 10px; flex-wrap: wrap; }
  .report-btn {
    font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 2px; padding: 10px 24px;
    background: var(--tab-inactive); border: 1px solid #a08a60; border-radius: 4px;
    cursor: pointer; color: var(--ink-faded); transition: all 0.2s ease; text-transform: uppercase;
  }
  .report-btn:hover { background: var(--parchment-mid); }
  .report-btn.active { background: var(--parchment-light); border-color: var(--seal-dark); color: var(--ink-dark); font-weight: 600; box-shadow: 0 2px 8px var(--shadow-soft); }
  .entry-page {
    display: none;
    background:
      radial-gradient(ellipse at 50% 50%, transparent 65%, rgba(160, 130, 80, 0.04) 100%),
      radial-gradient(ellipse at 20% 30%, rgba(210, 185, 140, 0.1) 0%, transparent 50%),
      radial-gradient(ellipse at 75% 60%, rgba(195, 170, 120, 0.08) 0%, transparent 45%),
      linear-gradient(180deg, var(--parchment-light) 0%, var(--parchment-mid) 50%, var(--parchment-light) 100%);
    border: 1px solid var(--seal-dark); border-radius: 0 4px 4px 4px; padding: 50px 65px 60px 65px;
    position: relative;
    box-shadow: 0 6px 30px var(--shadow-hard), 3px 3px 0 var(--parchment-dark), 6px 6px 0 rgba(180, 160, 120, 0.4);
    min-height: 500px; line-height: 1.75; overflow: hidden;
  }
  .entry-page.active { display: block; }
  .entry-page::before {
    content: ''; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(135deg, transparent, transparent 40px, rgba(139, 110, 70, 0.008) 40px, rgba(139, 110, 70, 0.008) 41px),
      repeating-linear-gradient(45deg, transparent, transparent 60px, rgba(139, 110, 70, 0.006) 60px, rgba(139, 110, 70, 0.006) 61px);
    pointer-events: none;
  }
  .entry-header { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 600; color: var(--ink-dark); margin-bottom: 6px; letter-spacing: 1px; }
  .entry-meta-line { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: var(--ink-faded); font-style: italic; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(139, 110, 70, 0.2); }
  .entry-text { font-family: 'Spectral', serif; font-size: 20px; color: var(--ink-body); line-height: 1.85; }
  .entry-text p { margin-bottom: 18px; text-indent: 1.5em; }
  .entry-text p:first-child { text-indent: 0; }
  .entry-text p.no-indent { text-indent: 0; }
  .entry-text em { font-style: normal; color: var(--ink-body); }
  .observer-note { font-family: 'Spectral', serif; font-size: 20px; font-style: italic; color: var(--ink-faded); padding: 0; margin: 20px 0; line-height: 1.85; }
  .signature { font-family: 'Spectral', serif; font-size: 18px; font-style: italic; color: var(--margin-note); text-align: right; margin-top: 30px; opacity: 0.8; }
  .page-number { text-align: center; margin-top: 30px; font-family: 'Cormorant Garamond', serif; font-size: 14px; color: var(--ink-faded); letter-spacing: 3px; }
  .page-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(139, 110, 70, 0.15); }
  .page-nav-btn { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: var(--ink-faded); cursor: pointer; padding: 6px 12px; border: 1px solid rgba(139, 110, 70, 0.3); background: rgba(228, 209, 168, 0.5); border-radius: 3px; transition: all 0.2s; }
  .page-nav-btn:hover { background: rgba(228, 209, 168, 0.8); color: var(--ink-dark); }
  .page-nav-btn.disabled { opacity: 0.3; cursor: default; pointer-events: none; }
  html { scroll-behavior: smooth; }
  .content-area { display: none; }
  .content-area.visible { display: block; }
  .loading { text-align: center; padding: 60px; color: var(--ink-faded); font-style: italic; font-size: 16px; }
  @media (max-width: 700px) {
    .entry-page { padding: 30px 25px 40px 35px; }
    .case-cover { padding: 30px 25px; }
    .cover-case-number { font-size: 22px; }
    .cover-seal { width: 60px; height: 60px; font-size: 7px; bottom: 15px; right: 20px; }
    .nav-tab { font-size: 11px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<div class="case-wrapper">
  <div class="case-cover" id="cover" onclick="openFile()">
    <div class="cover-stamp">Конфиденциально</div>
    <div class="cover-seal">СКРИП&shy;ТОРИЙ<br>B.Y.</div>
    <div class="cover-classification" id="coverOrg"></div>
    <div class="cover-case-number" id="coverTitle"></div>
    <div class="cover-subtitle" id="coverSubtitle"></div>
    <div class="cover-divider"></div>
    <div class="cover-meta" id="coverMeta"></div>
    <div class="cover-handwriting">Рутинное расследование. Определённо.</div>
    <div class="cover-click-hint">— нажмите, чтобы открыть дело —</div>
  </div>
  <div class="content-area" id="contentArea">
    <div class="report-selector" id="reportSelector"></div>
    <div class="nav-bar" id="navBar"></div>
    <div id="entriesContainer"></div>
  </div>
</div>

<script>
let manifest = null;
let currentReport = 0;
let currentEntry = 0;
const entryCache = {};

async function init() {
  const res = await fetch('manifest.json');
  manifest = await res.json();
  document.getElementById('coverOrg').textContent = manifest.organization;
  document.getElementById('coverTitle').textContent = manifest.title;
  document.getElementById('coverSubtitle').textContent = manifest.subtitle;
  document.getElementById('coverMeta').innerHTML =
    `<strong>Субъекты:</strong> ${manifest.subjects}<br>` +
    `<strong>Попутчики:</strong> ${manifest.companions}<br>` +
    `<strong>Район:</strong> ${manifest.region}<br>` +
    `<strong>Период:</strong> ${manifest.period}<br>` +
    `<strong>Статус:</strong> <em>${manifest.status}</em>`;
  document.title = manifest.title + ' — ' + manifest.organization;
}

function openFile() {
  document.getElementById('cover').style.display = 'none';
  document.getElementById('contentArea').classList.add('visible');
  renderReportButtons();
  renderTabs();
  showEntry(0);
}
function renderReportButtons() {
  const sel = document.getElementById('reportSelector');
  sel.innerHTML = manifest.reports.map((r, i) =>
    `<div class="report-btn${i === currentReport ? ' active' : ''}" onclick="switchReport(${i})">${r.title}</div>`
  ).join('');
}

function switchReport(idx) {
  currentReport = idx;
  currentEntry = 0;
  renderReportButtons();
  renderTabs();
  showEntry(0);
}

function renderTabs() {
  const navBar = document.getElementById('navBar');
  const entries = manifest.reports[currentReport].entries;
  navBar.innerHTML = entries.map((e, i) =>
    `<div class="nav-tab${i === currentEntry ? ' active' : ''}" onclick="showEntry(${i})">${e.tab}</div>`
  ).join('');
}

async function loadEntry(reportId, file) {
  const key = reportId + '/' + file;
  if (entryCache[key]) return entryCache[key];
  const res = await fetch('entries/' + key);
  const html = await res.text();
  entryCache[key] = html;
  return html;
}

async function showEntry(idx) {
  currentEntry = idx;
  const report = manifest.reports[currentReport];
  const entry = report.entries[idx];
  const container = document.getElementById('entriesContainer');
  const prevDisabled = idx === 0 ? ' disabled' : '';
  const nextDisabled = idx === report.entries.length - 1 ? ' disabled' : '';

  container.innerHTML = `<div class="entry-page active">
    <div class="entry-header">${entry.title}</div>
    <div class="entry-meta-line">${entry.meta}</div>
    <div class="entry-text"><div class="loading">загружаю запись...</div></div>
    <div class="page-number">— ${entry.tab} —</div>
    <div class="page-nav">
      <div class="page-nav-btn${prevDisabled}" onclick="showEntry(${idx - 1})">← предыдущая</div>
      <div class="page-nav-btn${nextDisabled}" onclick="showEntry(${idx + 1})">следующая →</div>
    </div>
  </div>`;

  renderTabs();
  container.scrollIntoView({ behavior: 'smooth', block: 'start' });

  const content = await loadEntry(report.id, entry.file);
  container.querySelector('.entry-text').innerHTML = content;
}

init();
</script>
</body>
</html>
