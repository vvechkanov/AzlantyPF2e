<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" font-family="Georgia, serif">

  <!-- Фон-бумага -->
  <rect width="1000" height="820" fill="#f5ecd6"/>

  <!-- Заголовок -->
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a1810">Дом Исцеления</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#6a4a2a" font-style="italic">план второго этажа · тоже П-образный, над атриумом — открытое небо</text>

  <!-- Компас -->
  <g transform="translate(945,95)">
    <circle r="28" fill="#f5ecd6" stroke="#2a1810" stroke-width="2"/>
    <polygon points="0,-22 8,8 0,2 -8,8" fill="#2a1810"/>
    <text y="-30" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a1810">С</text>
    <text x="34" y="5" text-anchor="middle" font-size="11" fill="#6a4a2a">В</text>
    <text x="-34" y="5" text-anchor="middle" font-size="11" fill="#6a4a2a">З</text>
    <text y="42" text-anchor="middle" font-size="10" fill="#6a4a2a">Ю (улица)</text>
  </g>

  <!-- ============================================================
       АТРИУМ (открытое небо — второго этажа над ним нет)
       Показан штриховкой как "проём вниз во двор"
       ============================================================ -->
  <defs>
    <pattern id="sky-hatch" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#c0d8e8" stroke-width="3"/>
    </pattern>
  </defs>
  <rect x="340" y="100" width="300" height="500" fill="#dceaf2" stroke="none"/>
  <rect x="340" y="100" width="300" height="500" fill="url(#sky-hatch)" opacity="0.5"/>

  <text x="490" y="320" text-anchor="middle" font-size="20" font-weight="bold" fill="#3a5a7a">проём над</text>
  <text x="490" y="345" text-anchor="middle" font-size="20" font-weight="bold" fill="#3a5a7a">АТРИУМОМ</text>
  <text x="490" y="370" text-anchor="middle" font-size="13" fill="#3a5a7a" font-style="italic">открытое небо — нет 2-го этажа</text>
  <text x="490" y="392" text-anchor="middle" font-size="11" fill="#3a5a7a" font-style="italic">видно крону груши снизу</text>

  <!-- Северная ограда (символическая) -->
  <line x1="340" y1="100" x2="640" y2="100" stroke="#7a5a3a" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- ============================================================
       ЗАПАДНОЕ КРЫЛО — Жилые послушников и Покои Жарикелы
       ============================================================ -->
  <rect x="80" y="180" width="260" height="420" fill="#e5d4b5" stroke="none"/>

  <!-- Внутренние перегородки (4 секции на западном крыле) -->
  <line x1="80" y1="285" x2="340" y2="285" stroke="#2a1810" stroke-width="2.5"/>
  <line x1="80" y1="390" x2="340" y2="390" stroke="#2a1810" stroke-width="2.5"/>
  <line x1="80" y1="495" x2="340" y2="495" stroke="#2a1810" stroke-width="2.5"/>

  <!-- Под жилыми внизу — кельи послушников (4 малых комнаты, как кельи) -->
  <line x1="210" y1="180" x2="210" y2="285" stroke="#2a1810" stroke-width="2"/>
  <text x="145" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a1810">КЕЛЬЯ</text>
  <text x="145" y="245" text-anchor="middle" font-size="9" fill="#5a3a14" font-style="italic">послушник</text>
  <text x="275" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a1810">КЕЛЬЯ</text>
  <text x="275" y="245" text-anchor="middle" font-size="9" fill="#5a3a14" font-style="italic">послушник</text>

  <line x1="210" y1="285" x2="210" y2="390" stroke="#2a1810" stroke-width="2"/>
  <text x="145" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a1810">КЕЛЬЯ</text>
  <text x="145" y="350" text-anchor="middle" font-size="9" fill="#5a3a14" font-style="italic">послушник</text>
  <text x="275" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a1810">КЕЛЬЯ</text>
  <text x="275" y="350" text-anchor="middle" font-size="9" fill="#5a3a14" font-style="italic">послушник</text>

  <!-- АРХИВ (на месте 3-й секции западного крыла) -->
  <text x="210" y="430" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a1810">АРХИВ</text>
  <text x="210" y="452" text-anchor="middle" font-size="11" fill="#5a3a14" font-style="italic">журналы пациентов</text>
  <text x="210" y="466" text-anchor="middle" font-size="11" fill="#5a3a14" font-style="italic">за 30 лет · библиотека</text>
  <!-- Книжные шкафы по стенам -->
  <rect x="90" y="475" width="240" height="10" fill="#5a3a14" stroke="#2a1810" stroke-width="0.5"/>

  <!-- ПОКОИ ЖАРИКЕЛЫ (нижняя секция западного крыла) -->
  <rect x="80" y="495" width="260" height="105" fill="#f0e6c4" stroke="none"/>
  <text x="210" y="525" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a1810">ПОКОИ ЖАРИКЕЛЫ</text>
  <text x="210" y="544" text-anchor="middle" font-size="10" fill="#5a3a14" font-style="italic">[[Жарикела]] · единственная личная</text>
  <!-- Маленький алтарь -->
  <rect x="285" y="555" width="35" height="14" fill="#a09080" stroke="#2a1810" stroke-width="1"/>
  <text x="302" y="565" text-anchor="middle" font-size="11" fill="#d4a017" font-weight="bold">☥</text>
  <text x="302" y="582" text-anchor="middle" font-size="8" fill="#5a3a14" font-style="italic">личный алтарь</text>
  <!-- Кровать -->
  <rect x="95" y="555" width="50" height="22" fill="#d4c0a0" stroke="#2a1810" stroke-width="0.8"/>
  <rect x="97" y="557" width="14" height="6" fill="#f8f0e0" stroke="#2a1810" stroke-width="0.4"/>
  <text x="120" y="588" text-anchor="middle" font-size="8" fill="#5a3a14" font-style="italic">кровать</text>
  <!-- Письменный стол -->
  <rect x="160" y="557" width="50" height="14" fill="#6a4a2a" stroke="#2a1810" stroke-width="0.8"/>
  <text x="185" y="588" text-anchor="middle" font-size="8" fill="#5a3a14" font-style="italic">стол</text>

  <!-- ============================================================
       ВОСТОЧНОЕ КРЫЛО — Тихие палаты для тяжёлых
       ============================================================ -->
  <rect x="640" y="180" width="240" height="420" fill="#f0e3c4" stroke="none"/>

  <text x="760" y="218" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a1810">ТИХИЕ ПАЛАТЫ</text>
  <text x="760" y="238" text-anchor="middle" font-size="11" fill="#5a3a14" font-style="italic">тяжёлые и долгосрочные</text>
  <text x="760" y="252" text-anchor="middle" font-size="11" fill="#5a3a14" font-style="italic">4-6 палат на 1-2 человека</text>

  <!-- Внутренние перегородки палат — 6 палат, 3+3 -->
  <line x1="760" y1="280" x2="760" y2="600" stroke="#2a1810" stroke-width="2"/>
  <line x1="640" y1="380" x2="880" y2="380" stroke="#2a1810" stroke-width="2"/>
  <line x1="640" y1="490" x2="880" y2="490" stroke="#2a1810" stroke-width="2"/>

  <text x="700" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a1810">палата 1</text>
  <text x="820" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a1810">палата 2</text>
  <text x="700" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a1810">палата 3</text>
  <text x="820" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a1810">палата 4</text>
  <text x="700" y="540" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a1810">палата 5</text>
  <text x="820" y="540" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a2010">палата 6</text>
  <text x="820" y="557" text-anchor="middle" font-size="9" fill="#7a2010" font-style="italic">изолятор</text>
  <text x="820" y="571" text-anchor="middle" font-size="9" fill="#7a2010" font-style="italic">заразные</text>

  <!-- Кровати в палатах (по одной для индикации) -->
  <rect x="660" y="345" width="30" height="14" fill="#d4c0a0" stroke="#2a1810" stroke-width="0.4"/>
  <rect x="780" y="345" width="30" height="14" fill="#d4c0a0" stroke="#2a1810" stroke-width="0.4"/>
  <rect x="660" y="455" width="30" height="14" fill="#d4c0a0" stroke="#2a1810" stroke-width="0.4"/>
  <rect x="780" y="455" width="30" height="14" fill="#d4c0a0" stroke="#2a1810" stroke-width="0.4"/>
  <rect x="660" y="565" width="30" height="14" fill="#d4c0a0" stroke="#2a1810" stroke-width="0.4"/>
  <rect x="780" y="582" width="30" height="14" fill="#d4c0a0" stroke="#2a1810" stroke-width="0.4"/>

  <!-- ============================================================
       ГЛАВНЫЙ КОРПУС — Холл наверху, лестничная площадка, доп. кельи
       ============================================================ -->
  <rect x="80" y="600" width="800" height="120" fill="#e8dabb" stroke="none"/>

  <!-- Внутренние перегородки -->
  <line x1="280" y1="600" x2="280" y2="720" stroke="#2a1810" stroke-width="3"/>
  <line x1="430" y1="600" x2="430" y2="720" stroke="#2a1810" stroke-width="3"/>
  <line x1="570" y1="600" x2="570" y2="720" stroke="#2a1810" stroke-width="3"/>
  <line x1="680" y1="600" x2="680" y2="720" stroke="#2a1810" stroke-width="3"/>

  <!-- Кладовая (юго-запад) -->
  <text x="180" y="650" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a1810">КЛАДОВАЯ</text>
  <text x="180" y="670" text-anchor="middle" font-size="10" fill="#5a3a14" font-style="italic">бельё · одеяла</text>
  <text x="180" y="685" text-anchor="middle" font-size="10" fill="#5a3a14" font-style="italic">запасы белья</text>

  <!-- Лестничный холл (центр) -->
  <text x="355" y="640" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a1810">ЛЕСТНИЧНЫЙ</text>
  <text x="355" y="657" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a1810">ХОЛЛ</text>
  <!-- Лестница вниз -->
  <g transform="translate(335,670)">
    <rect x="0" y="0" width="40" height="32" fill="#d4c0a0" stroke="#2a1810" stroke-width="1.5"/>
    <line x1="0" y1="5" x2="40" y2="5" stroke="#2a1810" stroke-width="0.8"/>
    <line x1="0" y1="10" x2="40" y2="10" stroke="#2a1810" stroke-width="0.8"/>
    <line x1="0" y1="15" x2="40" y2="15" stroke="#2a1810" stroke-width="0.8"/>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#2a1810" stroke-width="0.8"/>
    <line x1="0" y1="25" x2="40" y2="25" stroke="#2a1810" stroke-width="0.8"/>
    <line x1="0" y1="30" x2="40" y2="30" stroke="#2a1810" stroke-width="0.8"/>
    <text x="20" y="-5" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a1810">↓ 1 эт.</text>
  </g>

  <!-- Тихая комната (для приватных разговоров) -->
  <text x="500" y="645" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a1810">ТИХАЯ</text>
  <text x="500" y="663" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a1810">КОМНАТА</text>
  <text x="500" y="685" text-anchor="middle" font-size="9" fill="#5a3a14" font-style="italic">приватные беседы</text>
  <text x="500" y="700" text-anchor="middle" font-size="9" fill="#5a3a14" font-style="italic">исповеди</text>

  <!-- Дополнительная келья для гостей-волонтёров -->
  <text x="625" y="650" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a1810">КЕЛЬЯ</text>
  <text x="625" y="668" text-anchor="middle" font-size="9" fill="#5a3a14" font-style="italic">для гостей-</text>
  <text x="625" y="681" text-anchor="middle" font-size="9" fill="#5a3a14" font-style="italic">волонтёров</text>
  <text x="625" y="695" text-anchor="middle" font-size="9" fill="#5a3a14" font-style="italic">(Lion's Square)</text>

  <!-- Чулан хозяйственный -->
  <text x="780" y="650" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a1810">ХОЗЯЙСТВЕН-</text>
  <text x="780" y="668" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a1810">НЫЙ ЧУЛАН</text>
  <text x="780" y="690" text-anchor="middle" font-size="9" fill="#5a3a14" font-style="italic">инструменты, лампы</text>

  <!-- ============================================================
       ВНЕШНИЕ СТЕНЫ — тот же П-образный контур что на 1-м этаже
       ============================================================ -->
  <!-- Главный корпус -->
  <line x1="80" y1="600" x2="80" y2="720" stroke="#2a1810" stroke-width="8"/>
  <line x1="880" y1="600" x2="880" y2="720" stroke="#2a1810" stroke-width="8"/>
  <line x1="80" y1="720" x2="880" y2="720" stroke="#2a1810" stroke-width="8"/>

  <!-- Западное крыло -->
  <line x1="80" y1="180" x2="80" y2="600" stroke="#2a1810" stroke-width="8"/>
  <line x1="80" y1="180" x2="340" y2="180" stroke="#2a1810" stroke-width="8"/>
  <line x1="340" y1="180" x2="340" y2="600" stroke="#2a1810" stroke-width="8"/>

  <!-- Восточное крыло -->
  <line x1="880" y1="180" x2="880" y2="600" stroke="#2a1810" stroke-width="8"/>
  <line x1="640" y1="180" x2="880" y2="180" stroke="#2a1810" stroke-width="8"/>
  <line x1="640" y1="180" x2="640" y2="600" stroke="#2a1810" stroke-width="8"/>

  <!-- Двери из крыльев в галерею-окружение атриума -->
  <!-- (Открытый балкон вокруг атриума — но без отдельной комнаты, проход) -->
  <line x1="340" y1="305" x2="340" y2="340" stroke="#e5d4b5" stroke-width="6"/>
  <text x="358" y="326" font-size="9" fill="#5a3a14" font-style="italic">дверь</text>
  <line x1="340" y1="525" x2="340" y2="560" stroke="#f0e6c4" stroke-width="6"/>
  <text x="358" y="546" font-size="9" fill="#5a3a14" font-style="italic">дверь</text>

  <line x1="640" y1="305" x2="640" y2="340" stroke="#f0e3c4" stroke-width="6"/>
  <text x="618" y="326" text-anchor="end" font-size="9" fill="#5a3a14" font-style="italic">дверь</text>

  <!-- ===== Открытая галерея вдоль атриума (балкон) ===== -->
  <line x1="340" y1="100" x2="340" y2="600" stroke="#7a5a3a" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="640" y1="100" x2="640" y2="600" stroke="#7a5a3a" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="350" y="120" font-size="9" fill="#6a4a2a" font-style="italic">↑ перила галереи</text>
  <text x="630" y="120" text-anchor="end" font-size="9" fill="#6a4a2a" font-style="italic">перила галереи ↑</text>

  <!-- ===== Легенда ===== -->
  <g transform="translate(80,780)">
    <text x="0" y="0" font-size="11" font-weight="bold" fill="#2a1810">Легенда:</text>
    <rect x="70" y="-9" width="14" height="14" fill="url(#sky-hatch)" opacity="0.5" stroke="#3a5a7a" stroke-width="1"/>
    <text x="92" y="0" font-size="10" fill="#2a1810">— проём над атриумом (открытое небо)</text>
    <text x="305" y="0" font-size="11" fill="#2a1810">☥ — личный алтарь Жарикелы</text>
    <text x="495" y="0" font-size="10" fill="#7a2010">палата 6 — изолятор (заразные)</text>
    <text x="700" y="0" font-size="10" fill="#6a4a2a" font-style="italic">пунктир — балкон-галерея</text>
  </g>

</svg>
