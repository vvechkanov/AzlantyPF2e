<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" font-family="Georgia, serif">

  <!-- Фон-бумага -->
  <rect width="1000" height="820" fill="#f5ecd6"/>

  <!-- Заголовок -->
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a1810">Дом Исцеления</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#6a4a2a" font-style="italic">план первого этажа · Ivy District, Absalom · П-образный особняк с внутренним атриумом</text>

  <!-- Компас -->
  <g transform="translate(945,95)">
    <circle r="28" fill="#f5ecd6" stroke="#2a1810" stroke-width="2"/>
    <polygon points="0,-22 8,8 0,2 -8,8" fill="#2a1810"/>
    <text y="-30" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a1810">С</text>
    <text x="34" y="5" text-anchor="middle" font-size="11" fill="#6a4a2a">В</text>
    <text x="-34" y="5" text-anchor="middle" font-size="11" fill="#6a4a2a">З</text>
    <text y="42" text-anchor="middle" font-size="10" fill="#6a4a2a">Ю (улица)</text>
  </g>

  <!-- ============================================================
       АТРИУМ — внутренний двор (центр буквы П)
       Окружён зданием с 3 сторон: с юга — фасад, с запада — тыловое крыло, с востока — лечебничное крыло
       С севера — открыт (ограда сада)
       ============================================================ -->
  <rect x="340" y="100" width="300" height="500" fill="#b8d4a0" stroke="none"/>

  <!-- Подпись атриума -->
  <text x="490" y="140" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a3010">ВНУТРЕННИЙ ДВОР</text>
  <text x="490" y="160" text-anchor="middle" font-size="13" fill="#1a3010" font-style="italic">атриум · открыт сверху</text>

  <!-- Старая груша в центре атриума -->
  <circle cx="490" cy="340" r="55" fill="#6a8a40" stroke="#2a4010" stroke-width="2.5"/>
  <circle cx="475" cy="325" r="18" fill="#7a9a50" opacity="0.6"/>
  <circle cx="510" cy="330" r="20" fill="#7a9a50" opacity="0.6"/>
  <rect x="485" y="385" width="10" height="40" fill="#5a3a20"/>
  <text x="490" y="345" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">груша</text>

  <!-- Грядки трав (4 штуки вокруг груши) -->
  <rect x="365" y="200" width="100" height="50" fill="#8aa67a" stroke="#2a4010" stroke-width="1.2"/>
  <text x="415" y="230" text-anchor="middle" font-size="11" fill="#1a3010" font-style="italic">лаванда</text>

  <rect x="515" y="200" width="100" height="50" fill="#8aa67a" stroke="#2a4010" stroke-width="1.2"/>
  <text x="565" y="230" text-anchor="middle" font-size="11" fill="#1a3010" font-style="italic">ромашка</text>

  <rect x="365" y="440" width="100" height="50" fill="#8aa67a" stroke="#2a4010" stroke-width="1.2"/>
  <text x="415" y="470" text-anchor="middle" font-size="11" fill="#1a3010" font-style="italic">шалфей</text>

  <rect x="515" y="440" width="100" height="50" fill="#8aa67a" stroke="#2a4010" stroke-width="1.2"/>
  <text x="565" y="470" text-anchor="middle" font-size="11" fill="#1a3010" font-style="italic">мята</text>

  <!-- Скамья + столик с чайником -->
  <rect x="430" y="510" width="60" height="8" fill="#7a5a3a" stroke="#2a1810" stroke-width="0.8"/>
  <rect x="500" y="508" width="25" height="18" fill="#a08560" stroke="#2a1810" stroke-width="0.8"/>
  <circle cx="512" cy="517" r="4" fill="#c8a868" stroke="#5a3a14"/>
  <text x="478" y="540" text-anchor="middle" font-size="10" fill="#1a3010" font-style="italic">скамья + чайник</text>

  <!-- Жаровня -->
  <circle cx="400" cy="540" r="8" fill="#c84a20" stroke="#6a2a10" stroke-width="1"/>
  <text x="400" y="560" text-anchor="middle" font-size="10" fill="#1a3010" font-style="italic">жаровня</text>

  <!-- Северная ограда (символическая) -->
  <line x1="340" y1="100" x2="640" y2="100" stroke="#7a5a3a" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="490" y="92" text-anchor="middle" font-size="11" fill="#6a4a2a" font-style="italic">— ограда сада —</text>

  <!-- ============================================================
       ЗАПАДНОЕ КРЫЛО (тыловое): кухня + прачечная + лавка трав + жилые
       ============================================================ -->
  <rect x="80" y="180" width="260" height="420" fill="#e5d4b5" stroke="none"/>

  <!-- Внутренние перегородки западного крыла (горизонтальные) -->
  <line x1="80" y1="285" x2="340" y2="285" stroke="#2a1810" stroke-width="2.5"/>
  <line x1="80" y1="390" x2="340" y2="390" stroke="#2a1810" stroke-width="2.5"/>
  <line x1="80" y1="495" x2="340" y2="495" stroke="#2a1810" stroke-width="2.5"/>

  <text x="210" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#2a1810">КУХНЯ</text>
  <text x="210" y="260" text-anchor="middle" font-size="11" fill="#5a3a14" font-style="italic">котёл с супом</text>

  <text x="210" y="345" text-anchor="middle" font-size="18" font-weight="bold" fill="#2a1810">ПРАЧЕЧНАЯ</text>
  <text x="210" y="365" text-anchor="middle" font-size="11" fill="#5a3a14" font-style="italic">чаны для стирки</text>

  <text x="210" y="445" text-anchor="middle" font-size="18" font-weight="bold" fill="#2a1810">ЛАВКА ТРАВ</text>
  <text x="210" y="465" text-anchor="middle" font-size="11" fill="#5a3a14" font-style="italic">склянки, сушёные</text>

  <text x="210" y="540" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a1810">ЖИЛЫЕ КОМНАТЫ</text>
  <text x="210" y="558" text-anchor="middle" font-size="10" fill="#5a3a14" font-style="italic">Илейя · Энис · Кейна</text>
  <text x="210" y="572" text-anchor="middle" font-size="10" fill="#5a3a14" font-style="italic">+ послушники</text>

  <!-- Дверь из лавки трав в атриум (двор для трав) -->
  <line x1="340" y1="440" x2="340" y2="475" stroke="#b8d4a0" stroke-width="6"/>
  <text x="358" y="461" font-size="9" fill="#5a3a14" font-style="italic">дверь</text>

  <!-- Дверь из кухни в атриум -->
  <line x1="340" y1="230" x2="340" y2="265" stroke="#b8d4a0" stroke-width="6"/>
  <text x="358" y="251" font-size="9" fill="#5a3a14" font-style="italic">дверь</text>

  <!-- ============================================================
       ВОСТОЧНОЕ КРЫЛО: ЛЕЧЕБНИЦА (длинный зал вдоль крыла)
       ============================================================ -->
  <rect x="640" y="180" width="240" height="420" fill="#f0e3c4" stroke="none"/>

  <text x="760" y="220" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a1810">ЛЕЧЕБНИЦА</text>
  <text x="760" y="240" text-anchor="middle" font-size="11" fill="#5a3a14" font-style="italic">20 кроватей в два ряда</text>
  <text x="760" y="254" text-anchor="middle" font-size="11" fill="#5a3a14" font-style="italic">тканевые ширмы · потолочный фонарь</text>

  <!-- Два ряда кроватей (вертикально, вдоль крыла) -->
  <line x1="690" y1="280" x2="690" y2="580" stroke="#7a5a3a" stroke-width="4" stroke-dasharray="22,8"/>
  <line x1="830" y1="280" x2="830" y2="580" stroke="#7a5a3a" stroke-width="4" stroke-dasharray="22,8"/>
  <text x="690" y="275" text-anchor="middle" font-size="10" fill="#6a4a2a" font-style="italic">ряд 1</text>
  <text x="830" y="275" text-anchor="middle" font-size="10" fill="#6a4a2a" font-style="italic">ряд 2</text>

  <!-- Кровать Хейвен — первая в первом ряду (у окна) -->
  <circle cx="690" cy="290" r="7" fill="#e88040" stroke="#6a2a10" stroke-width="1.5"/>
  <text x="700" y="294" font-size="11" fill="#6a2a10" font-weight="bold">🟠 Хейвен</text>

  <!-- Дверь из лечебницы в атриум -->
  <line x1="640" y1="370" x2="640" y2="410" stroke="#b8d4a0" stroke-width="6"/>
  <text x="618" y="392" text-anchor="end" font-size="9" fill="#5a3a14" font-style="italic">дверь</text>

  <!-- ============================================================
       ГЛАВНЫЙ КОРПУС (юг, фасад): Малая Кейны / Вестибюль / Капелла
       ============================================================ -->
  <rect x="80" y="600" width="800" height="120" fill="#e8dabb" stroke="none"/>

  <!-- Внутренние перегородки фасада -->
  <line x1="280" y1="600" x2="280" y2="720" stroke="#2a1810" stroke-width="3"/>
  <line x1="680" y1="600" x2="680" y2="720" stroke="#2a1810" stroke-width="3"/>

  <!-- Малая комната Кейны (юго-запад угол) -->
  <text x="180" y="640" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a1810">МАЛАЯ КОМНАТА</text>
  <text x="180" y="662" text-anchor="middle" font-size="11" fill="#5a3a14" font-style="italic">приём «вышедших»</text>
  <text x="180" y="690" text-anchor="middle" font-size="12" fill="#2a1810">[[Кейна]]</text>

  <!-- Вестибюль (центр фасада) -->
  <text x="480" y="640" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a1810">ВЕСТИБЮЛЬ</text>
  <!-- Стол-стойка -->
  <rect x="430" y="652" width="100" height="22" fill="#6a4a2a" stroke="#2a1810" stroke-width="1.5"/>
  <text x="480" y="668" text-anchor="middle" font-size="11" fill="#f5ecd6" font-weight="bold">стол-стойка</text>
  <text x="480" y="692" text-anchor="middle" font-size="10" fill="#5a3a14" font-style="italic">журнал · мирской жрец</text>

  <!-- Кресло Хейвен в углу вестибюля у окна -->
  <circle cx="320" cy="660" r="6" fill="#e88040" stroke="#6a2a10" stroke-width="1.5"/>
  <text x="332" y="664" font-size="9" fill="#6a2a10">🟠 кресло Хейвен</text>

  <!-- Лавки вдоль стен -->
  <line x1="305" y1="710" x2="425" y2="710" stroke="#7a5a3a" stroke-width="4"/>
  <line x1="535" y1="710" x2="655" y2="710" stroke="#7a5a3a" stroke-width="4"/>

  <!-- Капелла (юго-восток угол) -->
  <text x="780" y="630" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a1810">МАЛЫЙ АЛТАРЬ</text>
  <text x="780" y="650" text-anchor="middle" font-size="11" fill="#5a3a14" font-style="italic">капелла · 30 мест</text>
  <!-- Алтарь -->
  <rect x="750" y="675" width="60" height="22" fill="#a09080" stroke="#2a1810" stroke-width="1.5"/>
  <text x="770" y="691" text-anchor="middle" font-size="18" fill="#d4a017" font-weight="bold">☥</text>
  <circle cx="795" cy="685" r="4" fill="#ffcc44" stroke="#7a5a14" stroke-width="1"/>
  <text x="780" y="712" text-anchor="middle" font-size="10" fill="#5a3a14" font-style="italic">алтарь · анх · свеча</text>

  <!-- ============================================================
       АРКА из вестибюля в лечебницу (через коридор/перегородку)
       Вестибюль ↔ Лечебница: проход в юго-восточном углу здания
       ============================================================ -->
  <line x1="640" y1="585" x2="700" y2="600" stroke="#e8dabb" stroke-width="0"/>
  <path d="M 640 600 Q 640 580 680 580 L 700 580 L 700 600" fill="#e8dabb" stroke="#2a1810" stroke-width="2"/>
  <text x="670" y="595" text-anchor="middle" font-size="9" fill="#5a3a14" font-style="italic">арка</text>

  <!-- Проход из вестибюля в западное крыло (тыл) -->
  <path d="M 280 600 Q 280 580 320 580 L 340 580 L 340 600" fill="#e8dabb" stroke="#2a1810" stroke-width="2"/>
  <text x="310" y="595" text-anchor="middle" font-size="9" fill="#5a3a14" font-style="italic">в тыл</text>

  <!-- ============================================================
       ВНЕШНИЕ СТЕНЫ — П-образный контур
       ============================================================ -->
  <!-- Главный корпус (фасад) -->
  <line x1="80" y1="600" x2="80" y2="720" stroke="#2a1810" stroke-width="8"/>
  <line x1="880" y1="600" x2="880" y2="720" stroke="#2a1810" stroke-width="8"/>
  <line x1="80" y1="720" x2="425" y2="720" stroke="#2a1810" stroke-width="8"/>
  <line x1="535" y1="720" x2="880" y2="720" stroke="#2a1810" stroke-width="8"/>

  <!-- Западное крыло -->
  <line x1="80" y1="180" x2="80" y2="600" stroke="#2a1810" stroke-width="8"/>
  <line x1="80" y1="180" x2="340" y2="180" stroke="#2a1810" stroke-width="8"/>
  <line x1="340" y1="180" x2="340" y2="220" stroke="#2a1810" stroke-width="8"/>
  <line x1="340" y1="265" x2="340" y2="440" stroke="#2a1810" stroke-width="8"/>
  <line x1="340" y1="475" x2="340" y2="600" stroke="#2a1810" stroke-width="8"/>

  <!-- Восточное крыло -->
  <line x1="880" y1="180" x2="880" y2="600" stroke="#2a1810" stroke-width="8"/>
  <line x1="640" y1="180" x2="880" y2="180" stroke="#2a1810" stroke-width="8"/>
  <line x1="640" y1="180" x2="640" y2="370" stroke="#2a1810" stroke-width="8"/>
  <line x1="640" y1="410" x2="640" y2="600" stroke="#2a1810" stroke-width="8"/>

  <!-- ===== ГЛАВНЫЙ ВХОД (двойные двери в фасаде) ===== -->
  <rect x="425" y="717" width="110" height="10" fill="#6a4a2a" stroke="#2a1810" stroke-width="1.5"/>
  <text x="480" y="713" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a1810">ГЛАВНЫЙ ВХОД</text>

  <!-- Скамья перед входом на улице -->
  <rect x="395" y="742" width="170" height="12" fill="#c8a868" stroke="#2a1810" stroke-width="1.5"/>
  <text x="480" y="775" text-anchor="middle" font-size="12" fill="#5a3a14" font-style="italic">«Сюда — без вопросов»</text>
  <text x="480" y="795" text-anchor="middle" font-size="12" fill="#6a4a2a" font-style="italic">— Sandown Street —</text>

  <!-- ===== Лестница на 2-й этаж в западном крыле ===== -->
  <g transform="translate(290,560)">
    <rect x="0" y="0" width="40" height="30" fill="#d4c0a0" stroke="#2a1810" stroke-width="1.5"/>
    <line x1="0" y1="5" x2="40" y2="5" stroke="#2a1810" stroke-width="0.8"/>
    <line x1="0" y1="10" x2="40" y2="10" stroke="#2a1810" stroke-width="0.8"/>
    <line x1="0" y1="15" x2="40" y2="15" stroke="#2a1810" stroke-width="0.8"/>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#2a1810" stroke-width="0.8"/>
    <line x1="0" y1="25" x2="40" y2="25" stroke="#2a1810" stroke-width="0.8"/>
    <text x="20" y="-6" text-anchor="middle" font-size="9" font-weight="bold" fill="#2a1810">↑ 2 эт.</text>
  </g>

  <!-- Указатель переулка справа -->
  <text x="910" y="400" font-size="11" fill="#6a4a2a" font-style="italic" transform="rotate(90 910,400)">переулок · бочки воды · уголь</text>

  <!-- ===== Легенда внизу ===== -->
  <g transform="translate(80,780)">
    <text x="0" y="0" font-size="11" font-weight="bold" fill="#2a1810">Легенда:</text>
    <circle cx="70" cy="-3" r="5" fill="#e88040" stroke="#6a2a10"/>
    <text x="80" y="0" font-size="10" fill="#2a1810">— [[Хейвен Баннистер]]</text>
    <text x="225" y="0" font-size="11" fill="#2a1810">☥ — золотой анх Саренры</text>
    <text x="395" y="0" font-size="10" fill="#2a1810">🟠 — оранжевая пряжа Хейвен</text>
    <text x="595" y="0" font-size="10" fill="#1a3010">зелёное — атриум открытый</text>
  </g>

</svg>
